<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Light-only lock: prevents WebKit from auto-darkening the page when the OS is in dark mode.
     A hardcoded white background alone does NOT stop this. -->
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<meta name="theme-color" content="#FFFFFF">
<meta name="format-detection" content="telephone=no,date=no,address=no,email=no">
<title>What's new</title>
<style>
/* ============================================================================
   1. RESET
   ========================================================================== */
*, *::before, *::after { box-sizing: border-box; }
html, body, h1, h2, p, figure, ul, li { margin: 0; padding: 0; }
ul { list-style: none; }
img { display: block; max-width: 100%; height: auto; }

/* ============================================================================
   2. TOKENS
   ---------------------------------------------------------------------------
   PLACEHOLDER VALUES. Every custom property below is replaced verbatim by the
   Claude Design bundle once it lands:
     _ds/fused-design-system-f83c2a1e-.../tokens/{colors,fonts,radius,spacing,typography}.css
   Do not re-derive these by eye from a screenshot — port the token files.
   Nothing below this block should contain a literal colour, radius or spacing
   value; everything references a var() so the re-skin is a token swap.
   ========================================================================== */
:root {
  color-scheme: light;

  /* -- colour ------------------------------------------------------------- */
  --c-bg:            #FFFFFF;
  --c-surface:       #F5F5F7;
  --c-text:          #1D1D1F;
  --c-text-muted:    #6E6E73;
  --c-text-subtle:   #8E8E93;
  --c-accent:        #0071E3;
  --c-hairline:      rgba(0, 0, 0, 0.08);
  --c-shot-frame:    rgba(0, 0, 0, 0.06);
  --c-shot-shadow:   rgba(0, 0, 0, 0.10);

  /* -- typography --------------------------------------------------------- */
  --f-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
            system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial,
            "Noto Sans", "Noto Sans TC", "Noto Sans JP", "Noto Sans KR",
            "Noto Sans Devanagari", sans-serif;

  --fs-eyebrow:  13px;  --lh-eyebrow:  1.30;  --ls-eyebrow:  0.06em;
  --fs-h1:       32px;  --lh-h1:       1.16;  --ls-h1:      -0.021em;
  --fs-lead:     17px;  --lh-lead:     1.50;  --ls-lead:    -0.011em;
  --fs-h2:       20px;  --lh-h2:       1.28;  --ls-h2:      -0.015em;
  --fs-body:     15px;  --lh-body:     1.55;  --ls-body:    -0.006em;
  --fs-caption:  13px;  --lh-caption:  1.45;  --ls-caption:  0em;

  --fw-regular: 400;
  --fw-medium:  500;
  --fw-semibold: 600;
  --fw-bold:    700;

  /* -- spacing ------------------------------------------------------------ */
  --sp-1:  4px;   --sp-2:  8px;   --sp-3: 12px;   --sp-4: 16px;
  --sp-5: 20px;   --sp-6: 24px;   --sp-7: 32px;   --sp-8: 40px;
  --sp-9: 56px;   --sp-10: 72px;

  /* -- radius ------------------------------------------------------------- */
  --r-sm: 8px;  --r-md: 14px;  --r-lg: 20px;  --r-xl: 28px;

  /* -- layout ------------------------------------------------------------- */
  --page-max: 420px;      /* design canvas width — confirm against .dc.html */
  --page-gutter: var(--sp-5);
}

/* ============================================================================
   3. BASE + WEBVIEW HARDENING
   ========================================================================== */
html {
  -webkit-text-size-adjust: 100%;   /* stop iOS inflating text on rotate */
  text-size-adjust: 100%;
}
body {
  background: var(--c-bg);
  color: var(--c-text);
  font-family: var(--f-sans);
  font-size: var(--fs-body);
  line-height: var(--lh-body);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;

  /* WebView chrome removal */
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;      /* no long-press "Save Image" sheet */
  -webkit-user-select: none;
  user-select: none;

  /* kill rubber-band overscroll revealing a white/grey band behind the page */
  overscroll-behavior-y: none;
}

/* Body copy stays selectable — users copy support text out of release notes. */
.feature__body, .sync__body, .footer__body { -webkit-user-select: text; user-select: text; }

/* ============================================================================
   4. LAYOUT
   ========================================================================== */
.page {
  max-width: var(--page-max);
  margin-inline: auto;
  padding-inline: var(--page-gutter);
  /* Safe areas: the WebView is frequently presented full-bleed under the
     notch / Dynamic Island and over the home indicator. */
  padding-top: calc(env(safe-area-inset-top, 0px) + var(--sp-8));
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + var(--sp-10));
  padding-left: max(var(--page-gutter), env(safe-area-inset-left, 0px));
  padding-right: max(var(--page-gutter), env(safe-area-inset-right, 0px));
}

/* ============================================================================
   5. HERO
   ========================================================================== */
.hero { text-align: center; }

/* <picture> is display:inline by default — width and `margin:auto` are both
   inert on it until it is made a block. */
.hero__art {
  display: block;
  width: 132px;
  margin: 0 auto var(--sp-6);
}
.hero__art img { width: 100%; }

.hero__eyebrow {
  font-size: var(--fs-eyebrow);
  line-height: var(--lh-eyebrow);
  letter-spacing: var(--ls-eyebrow);
  font-weight: var(--fw-semibold);
  text-transform: uppercase;
  color: var(--c-accent);
  margin-bottom: var(--sp-3);
}

.hero__title {
  font-size: var(--fs-h1);
  line-height: var(--lh-h1);
  letter-spacing: var(--ls-h1);
  font-weight: var(--fw-bold);
  text-wrap: balance;         /* keeps 2-line titles evenly split in de/ru */
  margin-bottom: var(--sp-3);
}

.hero__intro {
  font-size: var(--fs-lead);
  line-height: var(--lh-lead);
  letter-spacing: var(--ls-lead);
  color: var(--c-text-muted);
  text-wrap: pretty;
}

.hero__version {
  display: inline-block;
  margin-top: var(--sp-4);
  padding: var(--sp-1) var(--sp-3);
  border-radius: 999px;
  background: var(--c-surface);
  color: var(--c-text-subtle);
  font-size: var(--fs-caption);
  line-height: var(--lh-caption);
  font-weight: var(--fw-medium);
  font-variant-numeric: tabular-nums;
}
.hero__version[hidden] { display: none; }

/* ============================================================================
   6. FEATURES
   ========================================================================== */
.features { margin-top: var(--sp-10); }

.feature + .feature { margin-top: var(--sp-9); }

.feature__title {
  font-size: var(--fs-h2);
  line-height: var(--lh-h2);
  letter-spacing: var(--ls-h2);
  font-weight: var(--fw-semibold);
  text-wrap: balance;
  margin-bottom: var(--sp-2);
}

.feature__body {
  font-size: var(--fs-body);
  line-height: var(--lh-body);
  letter-spacing: var(--ls-body);
  color: var(--c-text-muted);
  text-wrap: pretty;
}

/* Long German compounds / unbroken Russian tokens must never widen the page. */
.feature__title, .feature__body, .hero__title, .sync__title { overflow-wrap: anywhere; }

.feature__shot {
  display: block;
  margin-top: var(--sp-5);
  border-radius: var(--r-xl);
  overflow: hidden;
  background: var(--c-surface);
  box-shadow: 0 1px 2px var(--c-shot-shadow), 0 0 0 1px var(--c-shot-frame) inset;
}
.feature__shot img { width: 100%; }

/* ============================================================================
   7. SYNC CALLOUT
   ========================================================================== */
.sync {
  margin-top: var(--sp-10);
  padding: var(--sp-7) var(--sp-6);
  border-radius: var(--r-lg);
  background: var(--c-surface);
  text-align: center;
}
.sync__art { display: block; width: 96px; margin: 0 auto var(--sp-5); }
.sync__art img { width: 100%; }
.sync__title {
  font-size: var(--fs-h2);
  line-height: var(--lh-h2);
  letter-spacing: var(--ls-h2);
  font-weight: var(--fw-semibold);
  text-wrap: balance;
  margin-bottom: var(--sp-2);
}
.sync__body {
  font-size: var(--fs-body);
  line-height: var(--lh-body);
  letter-spacing: var(--ls-body);
  color: var(--c-text-muted);
  text-wrap: pretty;
}

/* ============================================================================
   8. FOOTER
   ========================================================================== */
.footer {
  margin-top: var(--sp-9);
  padding-top: var(--sp-7);
  border-top: 1px solid var(--c-hairline);
  text-align: center;
}
.footer__title {
  font-size: var(--fs-body);
  line-height: var(--lh-body);
  font-weight: var(--fw-semibold);
  margin-bottom: var(--sp-1);
}
.footer__body {
  font-size: var(--fs-caption);
  line-height: var(--lh-caption);
  letter-spacing: var(--ls-caption);
  color: var(--c-text-subtle);
  text-wrap: pretty;
}

/* ============================================================================
   9. LOCALE TYPOGRAPHY
   ---------------------------------------------------------------------------
   Latin-tuned negative letter-spacing and 1.5 line-height do not transfer to
   CJK or Devanagari. These are :lang() rules, not JS branches.
   ========================================================================== */

/* CJK: never break inside words with the Latin rule set — it violates
   kinsoku (禁则) line-breaking. Reset the negative tracking too. */
:is(:lang(ja), :lang(ko), :lang(zh-Hant)) :is(
  .hero__title, .hero__intro, .feature__title, .feature__body,
  .sync__title, .sync__body, .footer__body
) {
  letter-spacing: 0;
  line-height: 1.7;
  word-break: normal;
  line-break: strict;
  overflow-wrap: normal;
}
:is(:lang(ja), :lang(ko), :lang(zh-Hant)) .hero__title { line-height: 1.34; }
:is(:lang(ja), :lang(ko), :lang(zh-Hant)) .feature__title,
:is(:lang(ja), :lang(ko), :lang(zh-Hant)) .sync__title { line-height: 1.45; }
/* Uppercasing is meaningless for CJK and adds unwanted tracking. */
:is(:lang(ja), :lang(ko), :lang(zh-Hant)) .hero__eyebrow {
  text-transform: none;
  letter-spacing: 0.02em;
}

/* Devanagari: matras and conjuncts sit outside the Latin em box and get
   clipped at 1.5. Extra leading is required, not cosmetic. */
:lang(hi) :is(.hero__intro, .feature__body, .sync__body, .footer__body) { line-height: 1.75; }
:lang(hi) :is(.hero__title, .feature__title, .sync__title) { line-height: 1.45; letter-spacing: 0; }
:lang(hi) .hero__eyebrow { text-transform: none; letter-spacing: 0.02em; }

/* de/ru run ~35% longer than en — ease the display size so titles keep to
   two lines at 320px. */
:is(:lang(de), :lang(ru)) .hero__title { font-size: calc(var(--fs-h1) * 0.88); }
:is(:lang(de), :lang(ru)) .feature__title { font-size: calc(var(--fs-h2) * 0.94); }
:lang(ru) .hero__eyebrow { letter-spacing: 0.04em; }

/* ============================================================================
   10. NARROW SCREENS (iPhone SE, 320pt)
   ========================================================================== */
@media (max-width: 359px) {
  :root {
    --fs-h1: 28px;
    --fs-h2: 18px;
    --page-gutter: var(--sp-4);
  }
  .hero__art { width: 112px; }
}

/* ============================================================================
   11. ACCESSIBILITY
   ========================================================================== */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}
</style>

  /* ==========================================================================
     RESOLUTION
     ======================================================================== */
  function params() {
    try { return new URLSearchParams(location.search); }
    catch (e) { return { get: function () { return null; } }; }
  }

  function matchOne(tag) {
    if (!tag) return null;
    var t = String(tag).trim();
    if (!t) return null;
    var lower = t.toLowerCase();

    for (var i = 0; i < SUPPORTED.length; i++) {
      if (SUPPORTED[i].toLowerCase() === lower) return SUPPORTED[i];
    }

    /* Chinese is resolved before the generic base match, otherwise any zh-*
       would fall into zh-Hant through its "zh" base. */
    if (lower === 'zh' || lower.indexOf('zh-') === 0) {
      if (/hant|\b(tw|hk|mo)\b/.test(lower)) return 'zh-Hant';
      return ZH_HANS_TO_HANT ? 'zh-Hant' : null;
    }

    var base = lower.split('-')[0];
    for (var j = 0; j < SUPPORTED.length; j++) {
      if (SUPPORTED[j].split('-')[0].toLowerCase() === base) return SUPPORTED[j];
    }
    return null;
  }

  function resolveLang() {
    var candidates = [];
    var q = params().get('lang');
    if (q) candidates.push(q);
    var navLangs = navigator.languages && navigator.languages.length
      ? navigator.languages
      : [navigator.language];
    candidates = candidates.concat(navLangs);

    for (var i = 0; i < candidates.length; i++) {
      var hit = matchOne(candidates[i]);
      if (hit) return hit;
    }
    return 'en';
  }

  /* ==========================================================================
     RENDER
     ======================================================================== */
  function render() {
    var lang = resolveLang();
    var dict = I18N[lang] || I18N.en;
    var fallback = I18N.en;

    document.documentElement.lang = lang;
    document.documentElement.dir = 'ltr';
    document.title = dict.doc_title || fallback.doc_title;

    var nodes = document.querySelectorAll('[data-i18n]');
    for (var i = 0; i < nodes.length; i++) {
      var key = nodes[i].getAttribute('data-i18n');
      var value = dict[key];
      if (value === undefined) value = fallback[key];
      if (value !== undefined) nodes[i].textContent = value;
    }

    /* Optional version chip: ?v=3.2.0 */
    var v = params().get('v');
    if (v && /^[\w.\-]{1,24}$/.test(v)) {
      var chip = document.getElementById('version');
      chip.textContent = 'v' + v.replace(/^v/i, '');
      chip.hidden = false;
    }

    /* Per-locale screenshots, when that locale ships its own set. */
    if (LOCALIZED_SHOTS.indexOf(lang) !== -1) {
      var shots = document.querySelectorAll('[data-shot]');
      for (var k = 0; k < shots.length; k++) {
        var n = shots[k].getAttribute('data-shot');
        var src = shots[k].querySelector('source');
        var img = shots[k].querySelector('img');
        if (src) src.srcset = 'assets/' + lang + '/shot-' + n + '.webp';
        if (img) img.src = 'assets/' + lang + '/shot-' + n + '.png';
      }
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', render);
  } else {
    render();
  }
})();
