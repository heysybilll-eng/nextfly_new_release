<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- The design ships as `auto`: the page follows the OS. Declaring both schemes
     is what stops WebKit from applying its own auto-darkening on top of ours. -->
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no,date=no,address=no,email=no">
<title>What's New</title>
<style>
/* ============================================================================
   RESET
   ========================================================================== */
*, *::before, *::after { box-sizing: border-box; }
html, body, h1, h2, p, div, button { margin: 0; padding: 0; }
img { display: block; max-width: 100%; }
button { font: inherit; color: inherit; background: none; border: 0; }

/* ============================================================================
   TOKENS  —  ported verbatim from the design handoff
   ---------------------------------------------------------------------------
   Light is the base. Dark is applied two ways: by OS preference (production
   behaviour) and by an explicit data-scheme attribute (QA override only).
   Every colour on this page resolves through one of these.
   ========================================================================== */
:root {
  color-scheme: light dark;

  --surface-bg:        #FFFFFF;
  --surface-elevated:  #F7F7F9;
  --surface-card:      #F2F2F7;
  --border-hairline:   #E3E3E8;
  --text-primary:      #16161A;
  --text-secondary:    #6E6E73;
  --text-tertiary:     #AEAEB2;
  --cta-inverse-fill:  #16161A;
  --cta-inverse-text:  #FFFFFF;

  --accent-primary:    #3E6AE1;
  --marker-gold:       #D9A441;

  /* The hero illustration is a theme token, not a filter. A purpose-drawn
     white version ships alongside the black one, so it swaps like any other
     colour and only the applicable file is ever downloaded. */
  --hero-art: url("assets/rocket-lineart.png");

  /* SF Pro / SF Pro Rounded are the real iOS system faces. The design
     prototype substituted MiSans only because SF Pro is not licensable there;
     on device these resolve to the genuine system fonts. `ui-rounded` is how
     Safari exposes SF Pro Rounded. Non-Latin scripts fall through to the
     platform faces (PingFang, Hiragino, Apple SD Gothic Neo, Devanagari
     Sangam MN) via -apple-system. */
  --family-body: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui,
                 "Segoe UI", Roboto, "Helvetica Neue", Arial,
                 "Noto Sans", "Noto Sans TC", "Noto Sans JP", "Noto Sans KR",
                 "Noto Sans Devanagari", sans-serif;
  --family-display: ui-rounded, "SF Pro Rounded", -apple-system,
                    BlinkMacSystemFont, system-ui, var(--family-body);

  --page-max: 480px;
  --gutter: 18px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-scheme="light"]) {
    --surface-bg:       #000000;
    --surface-elevated: #1C1C1E;
    --surface-card:     #232326;
    --border-hairline:  #2C2C2E;
    --text-primary:     #FFFFFF;
    --text-secondary:   #8E8E93;
    --text-tertiary:    #636366;
    --cta-inverse-fill: #FFFFFF;
    --cta-inverse-text: #000000;
    --hero-art: url("assets/rocket-lineart-white.png");
  }
}
:root[data-scheme="dark"] {
  --surface-bg:       #000000;
  --surface-elevated: #1C1C1E;
  --surface-card:     #232326;
  --border-hairline:  #2C2C2E;
  --text-primary:     #FFFFFF;
  --text-secondary:   #8E8E93;
  --text-tertiary:    #636366;
  --cta-inverse-fill: #FFFFFF;
  --cta-inverse-text: #000000;
  --hero-art: url("assets/rocket-lineart-white.png");
}

/* ============================================================================
   BASE + WEBVIEW HARDENING
   ========================================================================== */
html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}
body {
  min-height: 100vh;
  background: var(--surface-bg);
  color: var(--text-primary);
  font-family: var(--family-body);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;

  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
  overscroll-behavior-y: none;
}
.f__body, .parity__body, .feedback { -webkit-user-select: text; user-select: text; }

/* ============================================================================
   HEADER  —  sticky, no bottom border
   ========================================================================== */
.hdr {
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--surface-bg);
  padding-top: env(safe-area-inset-top, 0px);
}
.hdr__in {
  max-width: var(--page-max);
  margin: 0 auto;
  padding: 8px 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.hdr__title {
  flex: 1;
  min-width: 0;
  padding-left: 4px;
  font-size: 17px;
  font-weight: 600;
  letter-spacing: -0.01em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.langbtn {
  display: flex;
  align-items: center;
  gap: 4px;
  height: 32px;
  padding: 0 12px;
  border-radius: 999px;
  border: 1px solid var(--border-hairline);
  background: var(--surface-elevated);
  color: var(--text-primary);
  font-family: var(--family-body);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  flex: none;
  transition: filter 150ms, transform 60ms;
}
.langbtn:active { transform: scale(0.97); }
@media (hover: hover) { .langbtn:hover { filter: brightness(1.15); } }

/* ============================================================================
   BODY COLUMN
   ========================================================================== */
.body {
  max-width: var(--page-max);
  margin: 0 auto;
  padding: 32px var(--gutter) 56px;
  padding-bottom: calc(56px + env(safe-area-inset-bottom, 0px));
  padding-left: max(var(--gutter), env(safe-area-inset-left, 0px));
  padding-right: max(var(--gutter), env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  gap: 32px;
}

/* -- hero ------------------------------------------------------------------ */
.hero { display: flex; flex-direction: column; gap: 12px; }
.hero-art {
  width: 100%;
  max-width: 340px;
  margin: 0 auto 8px;
  aspect-ratio: 680 / 707;
  background: var(--hero-art) center / contain no-repeat;
}

.hero__heading {
  font-family: var(--family-display);
  font-size: 34px;
  font-weight: 700;
  line-height: 1.05;
  letter-spacing: -0.02em;
  margin-top: 8px;
}
.hero__intro {
  font-size: 17px;
  line-height: 1.4;
  color: var(--text-secondary);
  text-wrap: pretty;
}

/* -- section label --------------------------------------------------------- */
.seclabel { display: flex; flex-direction: column; gap: 12px; }
.seclabel__text {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.08em;
  color: var(--text-secondary);
}
/* The only hairline rule on the page. */
.seclabel__rule { height: 1px; background: var(--border-hairline); }

/* -- feature blocks -------------------------------------------------------- */
.f { display: flex; flex-direction: column; gap: 10px; }
.f__title {
  font-size: 22px;
  font-weight: 600;
  line-height: 1.2;
  letter-spacing: -0.01em;
  text-wrap: pretty;
}
.f__body {
  font-size: 17px;
  line-height: 1.7;     /* blocks with highlighted phrases need the room */
  color: var(--text-secondary);
  text-wrap: pretty;
}
.f--plain .f__body { line-height: 1.45; }   /* block 5 carries no highlights */

/* Hand-drawn marker underline, exactly as specified in the handoff. */
.mark {
  color: var(--text-primary);
  font-weight: 600;
  background-image: url("data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20viewBox=%270%200%20200%2014%27%20preserveAspectRatio=%27none%27%3E%3Cpath%20d=%27M4%2010c30-5%2058%202%2086-2s62-2%20106%203%27%20stroke=%27%23D9A441%27%20stroke-width=%275%27%20stroke-linecap=%27round%27%20fill=%27none%27%20opacity=%27.8%27/%3E%3C/svg%3E");
  background-repeat: no-repeat;
  background-position: 0 100%;
  background-size: 100% 9px;
  padding-bottom: 3px;
}

/* -- screenshot panel ------------------------------------------------------ */
.shot {
  margin-top: 6px;
  border-radius: 16px;
  background: var(--surface-elevated);
  padding: 22px;
  display: flex;
  justify-content: center;
  overflow: hidden;
}
/* <picture> is display:inline and would otherwise become the flex item,
   leaving the img unsized. display:contents makes the img the direct child so
   all sizing below applies to it. */
.shot picture { display: contents; }
.shot img {
  width: 66%;
  height: auto;
  border-radius: 14px;
  border: 1px solid var(--border-hairline);
}

/* -- parity card ----------------------------------------------------------- */
.parity {
  border-radius: 16px;
  border: 1px solid var(--border-hairline);
  background: var(--surface-card);
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.parity__row {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--accent-primary);
}
.parity__title {
  font-size: 17px;
  font-weight: 600;
  letter-spacing: -0.01em;
  color: var(--text-primary);
}
.parity__body {
  font-size: 15px;
  line-height: 1.45;
  color: var(--text-secondary);
  text-wrap: pretty;
}

/* -- feedback -------------------------------------------------------------- */
.feedback {
  font-size: 13px;
  line-height: 1.5;
  color: var(--text-tertiary);
  text-wrap: pretty;
}

/* ============================================================================
   LANGUAGE SHEET
   ========================================================================== */
.sheet {
  position: fixed;
  inset: 0;
  z-index: 60;
  background: rgba(0, 0, 0, 0.5);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  animation: scrim-in 250ms cubic-bezier(0.4, 0, 0.2, 1);
}
.sheet[hidden] { display: none; }
.sheet__panel {
  width: 100%;
  max-width: var(--page-max);
  background: var(--surface-elevated);
  border-top-left-radius: 24px;
  border-top-right-radius: 24px;
  padding: 12px 18px 28px;
  padding-bottom: calc(28px + env(safe-area-inset-bottom, 0px));
  max-height: 76vh;
  overflow-y: auto;
  animation: sheet-up 280ms cubic-bezier(0.4, 0, 0.2, 1);
}
@keyframes scrim-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes sheet-up { from { transform: translateY(100%); } to { transform: translateY(0); } }

.sheet__grabber {
  width: 36px;
  height: 5px;
  border-radius: 999px;
  background: var(--border-hairline);
  margin: 0 auto 14px;
}
.sheet__title {
  font-size: 17px;
  font-weight: 600;
  letter-spacing: -0.01em;
  padding-bottom: 8px;
}
.sheet__list { display: flex; flex-direction: column; }
.sheet__row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  width: 100%;
  min-height: 52px;
  padding: 12px 2px;
  background: transparent;
  border-bottom: 1px solid var(--border-hairline);
  color: var(--text-primary);
  font-family: var(--family-body);
  font-size: 17px;
  text-align: left;
  cursor: pointer;
  transition: filter 150ms, transform 60ms;
}
.sheet__row:active { transform: scale(0.99); }
@media (hover: hover) { .sheet__row:hover { filter: brightness(1.15); } }
.sheet__check { display: none; color: var(--accent-primary); }
.sheet__row[aria-selected="true"] .sheet__check { display: flex; }

body.sheet-open { overflow: hidden; }

/* ============================================================================
   LOCALE TYPOGRAPHY
   ---------------------------------------------------------------------------
   The design specifies one Latin-tuned treatment. Two adjustments are applied
   on top of it because the design's values clip or crowd non-Latin scripts —
   both are corrections needed to render the specified design faithfully, not
   restyling.
   ========================================================================== */

/* Devanagari matras and conjuncts extend past the Latin em box; feature titles
   at line-height 1.2 clip them. */
:lang(hi) .f__title { line-height: 1.45; }
:lang(hi) .hdr__title, :lang(hi) .sheet__title, :lang(hi) .parity__title { line-height: 1.4; }

/* Negative tracking is tuned for Latin and visibly crowds CJK. Kinsoku
   line-breaking also needs word-break left alone. */
:is(:lang(ja), :lang(ko), :lang(zh-TW)) :is(.f__title, .hdr__title, .parity__title, .sheet__title) {
  letter-spacing: 0;
}
:is(:lang(ja), :lang(ko), :lang(zh-TW)) :is(.f__body, .parity__body, .hero__intro, .feedback) {
  word-break: normal;
  line-break: strict;
}
:is(:lang(ja), :lang(ko), :lang(zh-TW)) .f__title { line-height: 1.35; }

/* Long German compounds and Russian tokens must never widen the page. */
.f__title, .hero__heading, .parity__title { overflow-wrap: anywhere; }

/* ============================================================================
   NARROW SCREENS  (iPhone SE / mini, 320-359pt)
   ---------------------------------------------------------------------------
   Not from the design, which specifies a single type scale. At 320px that
   scale runs the hero heading to the edge and breaks the intro onto three
   lines. Only the two display sizes and the gutter step down; body copy,
   colour and spacing rhythm are untouched.
   ========================================================================== */
@media (max-width: 359px) {
  :root { --gutter: 16px; }
  .hero__heading { font-size: 28px; }
  .f__title { font-size: 18px; }
}

/* ============================================================================
   WIDE SCREENS  (600px and up)
   ---------------------------------------------------------------------------
   Also not from the design: in the app this is only ever a phone-width
   WebView. This is a fallback for the URL being opened in a desktop browser
   or a large iPad, where a bare 480px column stranded in empty space reads as
   broken rather than deliberate. Nothing inside the column changes, so
   rendering at phone widths is unaffected.
   ========================================================================== */
@media (min-width: 600px) {
  body { background: var(--surface-elevated); }

  .shell {
    max-width: var(--page-max);
    margin: 40px auto;
    background: var(--surface-bg);
    border: 1px solid var(--border-hairline);
    border-radius: 20px;
  }

  /* Sticky would slide the header out of the card's rounded top, and there is
     no reach problem to solve on a pointer device. */
  .hdr {
    position: static;
    border-top-left-radius: 20px;
    border-top-right-radius: 20px;
  }

  /* The safe-area insets are meaningless here and the card supplies the
     breathing room the viewport padding was providing. */
  .body { padding-bottom: 56px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>

</main>

</div>

  /* ==========================================================================
     LANGUAGE RESOLUTION  —  order per the handoff:
     manual pick > lang param > locale > hl > navigator.language > en
     ======================================================================== */
  function params() {
    try { return new URLSearchParams(location.search); }
    catch (e) { return { get: function () { return null; } }; }
  }

  function normalize(raw) {
    if (!raw) return null;
    var v = String(raw).trim();
    if (!v) return null;
    var lower = v.toLowerCase();
    for (var i = 0; i < CODES.length; i++) {
      if (CODES[i].toLowerCase() === lower) return CODES[i];
    }
    var base = lower.split(/[-_]/)[0];
    if (base === 'zh') return 'zh-TW';
    for (var j = 0; j < CODES.length; j++) {
      if (CODES[j].toLowerCase().split('-')[0] === base) return CODES[j];
    }
    return null;
  }

  var picked = null;

  function activeLang() {
    var p = params();
    return picked
      || normalize(p.get('lang'))
      || normalize(p.get('locale'))
      || normalize(p.get('hl'))
      || normalize(navigator.language)
      || 'en';
  }

  /* ==========================================================================
     MARKER HIGHLIGHT
     --------------------------------------------------------------------------
     Splits "plain [[marked]] plain" into text nodes and .mark spans. Built with
     createTextNode rather than innerHTML so copy can never inject markup.
     ======================================================================== */
  function applyText(el, raw) {
    el.textContent = '';
    var parts = String(raw).split(/\[\[|\]\]/);
    for (var i = 0; i < parts.length; i++) {
      if (!parts[i]) continue;
      if (i % 2 === 1) {
        var span = document.createElement('span');
        span.className = 'mark';
        span.appendChild(document.createTextNode(parts[i]));
        el.appendChild(span);
      } else {
        el.appendChild(document.createTextNode(parts[i]));
      }
    }
  }

  /* ==========================================================================
     SHEET
     ======================================================================== */
  var sheet = document.getElementById('sheet');
  var sheetList = document.getElementById('sheetList');
  var langBtn = document.getElementById('langBtn');
  var lastFocus = null;

  function openSheet() {
    lastFocus = document.activeElement;
    sheet.hidden = false;
    document.body.classList.add('sheet-open');
    langBtn.setAttribute('aria-expanded', 'true');
    var active = sheetList.querySelector('[aria-selected="true"]');
    if (active) active.focus();
  }

  function closeSheet() {
    sheet.hidden = true;
    document.body.classList.remove('sheet-open');
    langBtn.setAttribute('aria-expanded', 'false');
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }

  langBtn.addEventListener('click', openSheet);
  sheet.addEventListener('click', closeSheet);
  document.getElementById('sheetPanel').addEventListener('click', function (e) {
    e.stopPropagation();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !sheet.hidden) closeSheet();
  });

  function buildSheet(lang) {
    sheetList.textContent = '';
    CODES.forEach(function (code) {
      var row = document.createElement('button');
      row.type = 'button';
      row.className = 'sheet__row';
      row.setAttribute('role', 'option');
      row.setAttribute('aria-selected', String(code === lang));
      row.lang = code;

      var name = document.createElement('span');
      name.textContent = STRINGS[code].langName;
      row.appendChild(name);

      var check = document.createElement('span');
      check.className = 'sheet__check';
      check.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" ' +
        'stroke="currentColor" stroke-width="2" stroke-linecap="round" ' +
        'stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>';
      row.appendChild(check);

      row.addEventListener('click', function () {
        picked = code;
        closeSheet();
        render();
      });
      sheetList.appendChild(row);
    });
  }

  /* ==========================================================================
     RENDER
     ======================================================================== */
  function render() {
    var lang = activeLang();
    var t = STRINGS[lang] || STRINGS.en;
    var p = params();

    document.documentElement.lang = lang;
    document.documentElement.dir = 'ltr';
    document.title = t.navTitle;

    document.getElementById('navTitle').textContent = t.navTitle;
    document.getElementById('langBadge').textContent = BADGES[lang] || 'EN';
    document.getElementById('intro').textContent = t.intro;
    document.getElementById('sectionLabel').textContent = t.sectionLabel;
    document.getElementById('sheetTitle').textContent = t.langSheetTitle;

    /* Heading is `versionWord + " " + version`. Neither is localized in the
       design — versionWord is a config input, not a STRINGS key. */
    var version = p.get('v') || '2.0.5';
    var versionWord = p.get('vw') || 'Version';
    if (!/^[\w.\-]{1,24}$/.test(version)) version = '2.0.5';
    document.getElementById('versionHeading').textContent = versionWord + ' ' + version;

    var nodes = document.querySelectorAll('[data-t]');
    for (var i = 0; i < nodes.length; i++) {
      var key = nodes[i].getAttribute('data-t');
      applyText(nodes[i], t[key] !== undefined ? t[key] : STRINGS.en[key]);
    }

    buildSheet(lang);
  }

  /* QA-only scheme override; production ships as auto (follows the OS). */
  var theme = params().get('theme');
  if (theme === 'light' || theme === 'dark') {
    document.documentElement.setAttribute('data-scheme', theme);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', render);
  } else {
    render();
  }
})();
</script>
